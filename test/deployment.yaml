apiVersion: apps/v1
kind: Deployment
metadata:
  name: conflict-demo-app
  namespace: fleet-conflict-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conflict-demo
  template:
    metadata:
      labels:
        app: conflict-demo
    spec:
      containers:
      - name: manager
        image: nginx:1.25
